<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>授权核对台</title>
<style>
  :root { --ok:#15803d; --no:#b91c1c; --warn:#b45309; --bg:#f6f7f9; --card:#fff; --line:#e2e5ea; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:#1f2430; }
  header { display:flex; align-items:center; gap:12px; padding:10px 18px; background:#1e293b; color:#fff; position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0; }
  header .sp { flex:1; }
  .dot { width:9px; height:9px; border-radius:50%; background:#94a3b8; display:inline-block; margin-right:5px; }
  .dot.on { background:#4ade80; }
  select, input, button { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; }
  button { cursor:pointer; background:#fff; }
  button.primary { background:#2563eb; border-color:#2563eb; color:#fff; }
  button.danger { color:var(--no); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  main { display:grid; grid-template-columns: 460px 1fr; gap:14px; padding:14px 18px; align-items:start; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:14px; }
  .card h2 { font-size:14px; margin:0 0 10px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:5px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:#64748b; font-weight:600; }
  .tag { display:inline-block; padding:1px 7px; border-radius:99px; font-size:12px; }
  .tag.allow { background:#dcfce7; color:var(--ok); }
  .tag.deny { background:#fee2e2; color:var(--no); }
  .tag.src { background:#e0e7ff; color:#3730a3; }
  .formgrid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .formgrid .full { grid-column:1/-1; }
  .page { border:1px solid var(--line); border-radius:10px; background:#fff; margin-bottom:12px; overflow:hidden; transition:box-shadow .3s; }
  .page.hit { box-shadow:0 0 0 3px #fbbf24; }
  .page > h3 { margin:0; padding:9px 14px; background:#f1f5f9; font-size:14px; display:flex; gap:10px; align-items:center; }
  .op { display:flex; align-items:center; gap:10px; padding:7px 14px; border-top:1px solid var(--line); }
  .op .name { width:150px; font-family:ui-monospace,monospace; font-size:13px; }
  .op .vis { width:52px; font-weight:600; }
  .vis.y { color:var(--ok); } .vis.n { color:var(--no); }
  .op .basis { color:#475569; flex:1; }
  .op.changed { background:#fffbeb; }
  details { flex-basis:100%; }
  .ev { margin:6px 0 2px; padding:8px 10px; border-left:3px solid var(--line); background:#fafafa; border-radius:0 6px 6px 0; font-size:12.5px; }
  .ev.a { border-color:var(--ok); } .ev.d { border-color:var(--no); }
  .opwrap { flex:1; display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
  .banner { background:#fffbeb; border:1px solid #fcd34d; border-radius:10px; padding:9px 14px; margin-bottom:12px; font-size:13px; }
  .banner b { color:var(--warn); }
  .hist { font-size:12.5px; color:#475569; max-height:150px; overflow:auto; margin:0; padding-left:18px; }
  .conflict { color:var(--warn); font-weight:600; }
  .muted { color:#94a3b8; font-size:12px; }
  .rolebar { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
</style>
</head>
<body>
<header>
  <h1>授权核对台</h1>
  <span><span class="dot" id="dot"></span><span id="conn">连接中…</span></span>
  <span class="sp"></span>
  <button id="undoBtn">↩ 撤销上一次调整</button>
</header>
<main>
  <section>
    <div class="card">
      <h2 id="formTitle">新增授权声明</h2>
      <div class="formgrid">
        <label>来源
          <select id="fSource" class="full">
            <option value="role">role · 角色授权</option>
            <option value="ownership">ownership · 资源归属</option>
            <option value="deny">deny · 拒绝声明</option>
          </select></label>
        <label>效果
          <select id="fEffect" class="full">
            <option value="allow">allow · 允许</option>
            <option value="deny">deny · 拒绝</option>
          </select></label>
        <label>角色 <input id="fRole" list="roles" class="full" placeholder="如 editor 或 *"></label>
        <label>资源 <input id="fResource" class="full" placeholder="如 order 或 *"></label>
        <label>操作 <input id="fAction" class="full" placeholder="如 view 或 *"></label>
        <label>备注 <input id="fNote" class="full" placeholder="依据说明"></label>
      </div>
      <div style="margin-top:10px; display:flex; gap:8px;">
        <button class="primary" id="saveBtn">保存声明</button>
        <button id="cancelBtn" style="display:none">取消编辑</button>
      </div>
      <datalist id="roles"></datalist>
    </div>
    <div class="card">
      <h2>授权声明（多来源，可增删改）</h2>
      <table>
        <thead><tr><th>#</th><th>来源</th><th>效果</th><th>角色</th><th>资源:操作</th><th>备注</th><th></th></tr></thead>
        <tbody id="stBody"></tbody>
      </table>
    </div>
    <div class="card">
      <h2>调整历史（新→旧）</h2>
      <ol class="hist" id="hist" reversed></ol>
    </div>
  </section>
  <section>
    <div class="rolebar card">
      <b>页面收敛视图</b>
      <span>当前身份角色：</span>
      <select id="roleSel"></select>
      <span class="muted">页面操作可见性 = 服务端当前授权结论（允许才可见）</span>
    </div>
    <div id="banner"></div>
    <div id="pages"></div>
  </section>
</main>
<script>
let state = null;
let currentRole = localStorage.getItem('role') || 'editor';
let editingId = null;
let lastAffected = {};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const srcName = { role:'角色授权', ownership:'资源归属', deny:'拒绝声明' };

async function api(path, method, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) alert(data.error || ('请求失败 ' + res.status));
  return res.ok ? data : null;
}

function render() {
  if (!state) return;
  // 角色下拉
  const roles = state.roles;
  if (!roles.includes(currentRole)) currentRole = roles[0];
  $('roleSel').innerHTML = roles.map(r =>
    `<option ${r === currentRole ? 'selected' : ''}>${esc(r)}</option>`).join('');
  $('roles').innerHTML = roles.concat(['*']).map(r => `<option>${esc(r)}</option>`).join('');

  // 声明表
  $('stBody').innerHTML = state.statements.map(s => `<tr>
    <td>${s.id}</td>
    <td><span class="tag src">${esc(s.source)}</span></td>
    <td><span class="tag ${s.effect}">${s.effect}</span></td>
    <td>${esc(s.role)}</td>
    <td><code>${esc(s.resource)}:${esc(s.action)}</code></td>
    <td>${esc(s.note || '')}</td>
    <td style="white-space:nowrap">
      <button onclick="startEdit(${s.id})">改</button>
      <button class="danger" onclick="delSt(${s.id})">删</button>
    </td></tr>`).join('');

  // 历史
  $('hist').innerHTML = state.history.slice().reverse()
    .map(h => `<li>#${h.seq} ${esc(h.label)}</li>`).join('') || '<li class="muted">暂无调整</li>';
  $('undoBtn').disabled = state.history.length === 0;

  // 变更横幅
  if (state.change) {
    const pages = Object.keys(state.change.affected || {});
    const names = pages.map(id => (state.pages.find(p => p.id === id) || {}).name || id);
    $('banner').innerHTML = pages.length
      ? `<div class="banner"><b>收敛完成：</b>${esc(state.change.label)}<br>受影响页面：${names.map(esc).join('、')}</div>`
      : `<div class="banner"><b>收敛完成：</b>${esc(state.change.label)}（无页面结论变化）</div>`;
    lastAffected = state.change.affected || {};
  }

  // 页面视图
  const concl = state.conclusions[currentRole] || {};
  $('pages').innerHTML = state.pages.map(p => {
    const hit = lastAffected[p.id] && lastAffected[p.id].some(c => c.role === currentRole);
    const changedKeys = new Set((lastAffected[p.id] || []).filter(c => c.role === currentRole).map(c => c.op));
    const ops = p.ops.map(op => {
      const key = `${op.resource}:${op.action}`;
      const r = (concl[p.id] || {})[key];
      if (!r) return '';
      const ev = [...r.allows.map(s => evHtml(s, 'a')), ...r.denies.map(s => evHtml(s, 'd'))].join('');
      return `<div class="op ${changedKeys.has(key) ? 'changed' : ''}">
        <span class="name">${esc(op.resource)}:${esc(op.action)}</span>
        <span class="vis ${r.visible ? 'y' : 'n'}">${r.visible ? '● 可见' : '○ 隐藏'}</span>
        <div class="opwrap">
          <span class="basis">${r.conflict ? '<span class="conflict">[冲突·拒绝优先]</span> ' : ''}${esc(r.basis)}</span>
          ${ev ? `<details><summary>依据链（允许 ${r.allows.length} / 拒绝 ${r.denies.length}）</summary>${ev}</details>` : '<span class="muted">无匹配声明</span>'}
        </div>
      </div>`;
    }).join('');
    return `<div class="page ${hit ? 'hit' : ''}"><h3>${esc(p.name)}${hit ? ' <span class="tag" style="background:#fef3c7;color:#b45309">本次受影响</span>' : ''}</h3>${ops}</div>`;
  }).join('');
}

function evHtml(s, cls) {
  return `<div class="ev ${cls}"><span class="tag ${s.effect}">${s.effect}</span>
    <span class="tag src">${esc(srcName[s.source] || s.source)}</span>
    声明#${s.id} · ${esc(s.role)} · <code>${esc(s.resource)}:${esc(s.action)}</code>
    ${s.note ? '· ' + esc(s.note) : ''}</div>`;
}

window.startEdit = id => {
  const s = state.statements.find(x => x.id === id);
  if (!s) return;
  editingId = id;
  $('formTitle').textContent = `编辑声明 #${id}`;
  $('fSource').value = s.source; $('fEffect').value = s.effect;
  $('fRole').value = s.role; $('fResource').value = s.resource;
  $('fAction').value = s.action; $('fNote').value = s.note || '';
  $('cancelBtn').style.display = '';
};
window.delSt = id => { if (confirm(`删除声明 #${id}？`)) api(`/api/statements/${id}`, 'DELETE'); };

$('cancelBtn').onclick = () => {
  editingId = null;
  $('formTitle').textContent = '新增授权声明';
  $('cancelBtn').style.display = 'none';
};
$('saveBtn').onclick = () => {
  const body = {
    source: $('fSource').value, effect: $('fEffect').value,
    role: $('fRole').value, resource: $('fResource').value,
    action: $('fAction').value, note: $('fNote').value,
  };
  const p = editingId ? api(`/api/statements/${editingId}`, 'PUT', body) : api('/api/statements', 'POST', body);
  p.then(ok => { if (ok) $('cancelBtn').onclick(); });
};
$('undoBtn').onclick = () => api('/api/undo', 'POST');
$('roleSel').onchange = e => { currentRole = e.target.value; localStorage.setItem('role', currentRole); render(); };

// SSE 实时收敛推送
const es = new EventSource('/api/events');
es.onopen = () => { $('dot').classList.add('on'); $('conn').textContent = '已连接（实时推送）'; };
es.onerror = () => { $('dot').classList.remove('on'); $('conn').textContent = '连接断开，重试中…'; };
es.onmessage = e => { state = JSON.parse(e.data); render(); };
</script>
</body>
</html>
